name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 单元测试
        run: pnpm test

      - name: 生产构建
        run: pnpm build
        env:
          DATABASE_URL: file:./data/ci-placeholder.db
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
